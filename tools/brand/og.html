<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Vazirmatn';
  font-weight: 100 900;
  src: url('../../assets/fonts/Vazirmatn-arabic.woff2') format('woff2');
  unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC;
}
@font-face {
  font-family: 'Vazirmatn';
  font-weight: 100 900;
  src: url('../../assets/fonts/Vazirmatn-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+2000-206F;
}
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: 'Vazirmatn', sans-serif;
  color: #f3eee4;
  background:
    radial-gradient(circle at 28% 50%, rgba(233, 69, 96, 0.22), transparent 42%),
    linear-gradient(135deg, #0d1b35 0%, #04070f 100%);
  display: flex;
  align-items: center;
  gap: 56px;
  padding: 0 72px;
}
.text { flex: 1; }
h1 { font-size: 104px; font-weight: 800; line-height: 1.1; }
.fa { font-size: 36px; font-weight: 500; color: #c9c3b8; margin-top: 18px; }
.en {
  direction: ltr; text-align: right;
  font-size: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
  color: #e94560; margin-top: 34px;
}
.url { direction: ltr; text-align: right; font-size: 26px; font-weight: 700; color: #8a93a8; margin-top: 10px; }
img { width: 470px; height: 470px; flex: none; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55)); }
</style>
</head>
<body>
  <div class="text">
    <h1>شیطان بزرگ</h1>
    <p class="fa">دخالت‌های آمریکا در امور داخلی ایران</p>
    <p class="en">The Great Devil — US Interventions in Iran</p>

  </div>
  <img src=".seal.png" alt="">

</html>
